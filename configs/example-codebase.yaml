# Codebase configuration for the indexer.
# Copy this file and customize for each codebase you want to index.
#
# Usage:
#   cp configs/example-codebase.yaml configs/my-project.yaml
#   ./scripts/index.sh configs/my-project.yaml
#
# Under the thin-client architecture (issue #18), the indexer ships file
# content to the MCP server, which runs the pipeline using its own backend
# credentials. This file therefore only describes the codebase itself — the
# embeddings / vector_store / metadata_store sections live in the SERVER's
# config (see config.example.yaml), not here.

codebase:
  # Absolute path to the codebase root
  path: /home/you/repos/my-project

  # Unique identifier (used in MCP tool calls as the "codebase" parameter)
  name: my-project

  # Languages to parse. Supported: go, python, typescript, javascript,
  # rust, c, cpp, kotlin, swift, dart
  languages:
    - go
    - python
    - typescript

  # Glob patterns to exclude from indexing
  exclude_patterns:
    - "vendor/**"
    - "node_modules/**"
    - "**/*_test.go"
    - "**/test/**"
    - "**/*.min.js"

# Indexing behavior
indexing:
  # Skip files whose content hash already exists in the index.
  # Set to false (or pass --reindex) to force a full re-process.
  incremental: true
