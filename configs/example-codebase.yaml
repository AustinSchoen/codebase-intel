# Codebase configuration for the indexer.
# Copy this file and customize for each codebase you want to index.
#
# Usage:
#   cp configs/example-codebase.yaml configs/my-project.yaml
#   ./scripts/index.sh configs/my-project.yaml

codebase:
  # Absolute path to the codebase root
  path: /home/you/repos/my-project

  # Unique identifier (used in MCP tool calls as the "codebase" parameter)
  name: my-project

  # Languages to parse (supported: go, python, typescript, javascript, rust, kotlin, swift)
  languages:
    - go
    - python
    - typescript

  # Glob patterns to exclude from indexing
  exclude_patterns:
    - "vendor/**"
    - "node_modules/**"
    - "**/*_test.go"
    - "**/test/**"
    - "**/*.min.js"

# Indexing behavior
indexing:
  # Max lines per code chunk (10-500)
  chunk_max_lines: 200

  # Overlap between adjacent chunks
  chunk_overlap_lines: 20

  # Embedding batch size (1-128)
  batch_size: 128

  # Parallel embedding requests
  concurrent_requests: 10

  # Parallel file processing
  concurrent_files: 4

  # Skip unchanged files on re-index
  incremental: true

# Embedding provider
embeddings:
  model: voyage-code-3
  api_key_env: VOYAGE_API_KEY

# Vector store (points to the Docker Qdrant instance)
vector_store:
  url: http://localhost:6333
  api_key_env: QDRANT_API_KEY

# Metadata store (points to the Docker Postgres instance)
metadata_store:
  host: localhost
  port: 5432
  database: codebase_intel
  user_env: CI_PG_USER
  password_env: CI_PG_PASSWORD
