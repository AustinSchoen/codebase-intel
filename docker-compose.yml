services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: codebase_intel
      POSTGRES_USER: ${CI_PG_USER}
      POSTGRES_PASSWORD: ${CI_PG_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CI_PG_USER} -d codebase_intel"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build: .
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8090:8090"
    env_file: .env
    environment:
      - CODEBASE_INTEL_CONFIG=/app/config.yaml
    volumes:
      - ./configs/server.yaml:/app/config.yaml:ro
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
